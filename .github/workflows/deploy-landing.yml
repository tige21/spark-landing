name: Deploy Landing

# Builds the Astro site in the cloud and rsyncs dist/ to BOTH geo arms. Ни одно из плеч не резерв:
# sparkcards.space резолвится по местоположению клиента, из РФ юзера обслуживает vdsina
# 83.217.215.66, всех остальных (и всех под VPN) — 62yun FRA 194.5.65.182. Пропущенное плечо =
# половина аудитории на прошлой сборке, поэтому job падает при ошибке любого из них и после
# заливки проверяет, что оба отдают одну и ту же сборку.
# Старый бокс 185.214.108.29 умер и выведен 2026-07-09 — деплой туда не попадал никуда.
# Триггерится каждым пушем в main, который трогает сайт.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: landing-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build & Deploy Landing (both mirrors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hero-frames/ are Git LFS objects — without this the checkout gets
          # pointer files, astro ships a frames-less dist, and rsync --delete
          # would wipe the scroll frames off the live mirrors.
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (astro)
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist && test -n "$(ls -A dist)" || { echo "dist/ empty"; exit 1; }
          # Guard: hero-frames must be in the build, else rsync --delete would wipe
          # the scroll frames off the live servers (frames-less LFS-pointer checkout).
          for s in hero decks play create; do
            test -f "dist/hero-frames/$s/0001.webp" \
              || { echo "::error::dist/hero-frames/$s/0001.webp missing — refusing to deploy (would wipe live frames). Check Git LFS / lfs:true checkout."; exit 1; }
          done
          # An LFS pointer is ~130 bytes of text; a real webp is KBs. Catch a
          # checkout that fetched pointers instead of the binaries.
          sz=$(wc -c < dist/hero-frames/decks/0001.webp)
          test "$sz" -gt 1000 || { echo "::error::dist/hero-frames/decks/0001.webp is $sz bytes — looks like an unresolved LFS pointer, not a webp. Aborting."; exit 1; }
          echo "Build: $(du -sh dist | cut -f1), $(find dist -type f | wc -l) files, hero-frames OK ($(find dist/hero-frames -type f | wc -l) frames)"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LANDING_DEPLOY_KEY }}" > ~/.ssh/landing_key
          chmod 600 ~/.ssh/landing_key

      - name: Deploy to both mirrors
        run: |
          set -u
          WEBROOT=/var/www/sparkcards.space
          SSH="ssh -i ~/.ssh/landing_key -p 22 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          deploy_one() {
            local name="$1" host="$2"
            echo "===== $name ($host) ====="
            ssh-keyscan -p 22 "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
            $SSH "root@$host" \
              "mkdir -p $WEBROOT; \
               if [ -n \"\$(ls -A $WEBROOT 2>/dev/null)\" ]; then \
                 tar czf /var/www/sparkcards-space-backup-\$(date +%Y%m%d-%H%M%S).tar.gz -C /var/www sparkcards.space; \
                 ls -t /var/www/sparkcards-space-backup-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f; \
               fi" || { echo "::warning::$name: connect/backup failed"; return 1; }
            rsync -avz --delete -e "$SSH" dist/ "root@$host:$WEBROOT/" \
              || { echo "::warning::$name: rsync failed"; return 1; }
            $SSH "root@$host" \
              "chown -R www-data:www-data $WEBROOT 2>/dev/null || true; systemctl reload nginx" \
              || { echo "::warning::$name: nginx reload failed"; return 1; }
            echo "$name: OK"
          }
          rc=0
          deploy_one "vdsina-RU (плечо для РФ)"        "83.217.215.66" || rc=1
          deploy_one "62yun-FRA (зарубежное плечо)"    "194.5.65.182"  || rc=1
          if [ "$rc" -eq 0 ]; then
            echo "✅ оба плеча обновлены"
          else
            echo "::error::плечо не обновилось — половина аудитории осталась на прошлой сборке"
            exit 1
          fi

      - name: Verify both arms serve the new build
        run: |
          set -u
          # rsync и reload могут пройти, а наружу отдаваться старое: не тот вебрут, чужой vhost,
          # кэш. Сравниваем то, что реально отдаётся по каждому адресу, с тем, что собрали.
          local_sha=$(sha256sum dist/index.html | cut -d' ' -f1)
          rc=0
          check_arm() {
            local name="$1" ip="$2" got
            got=$(curl -sS -m 30 --resolve "sparkcards.space:443:$ip" https://sparkcards.space/ 2>/dev/null | sha256sum | cut -d' ' -f1)
            if [ "$got" = "$local_sha" ]; then
              echo "$name ($ip): отдаёт свежую сборку"
            else
              echo "::error::$name ($ip) отдаёт другую сборку — эта часть аудитории осталась на прошлой версии"
              rc=1
            fi
          }
          check_arm "62yun-FRA (зарубежное плечо)" "194.5.65.182"
          check_arm "vdsina-RU (плечо для РФ)"     "83.217.215.66"
          [ "$rc" -eq 0 ] || exit 1
          echo "оба плеча отдают одну и ту же свежую сборку"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/landing_key
