# Spark Cards landing — nginx vhost for sparkcards.space
# Place at /etc/nginx/sites-available/sparkcards.space and symlink into sites-enabled.
# Run certbot --nginx afterwards; it adds the 443 server block + HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name sparkcards.space www.sparkcards.space;

    root /var/www/sparkcards.space;
    index index.html;

    # Hashed, immutable build assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    access_log /var/log/nginx/sparkcards.space.access.log;
    error_log  /var/log/nginx/sparkcards.space.error.log;
}
